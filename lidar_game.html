<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIDAR Simulator 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #0f0;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 5px;
            z-index: 100;
            font-size: 14px;
            line-height: 1.6;
        }
        #scan-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #0ff;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            z-index: 100;
            font-size: 12px;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="info">
        <strong>🎮 LIDAR Simulator 3D</strong><br>
        <br>
        <strong>Управление:</strong><br>
        W - Вперёд<br>
        A - Влево<br>
        S - Назад<br>
        D - Вправо<br>
        <br>
        M1 (ЛКМ) + Колесо - Лазерный скан<br>
        M2 (ПКМ) + Движение - Поворот камеры<br>
        <br>
        <strong>Статус:</strong> <span id="status">Готов</span>
    </div>
    <div id="scan-info">
        Точек в облаке: <span id="point-count">0</span> | 
        Сканирование: <span id="scan-status">Выкл</span>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // Сцена и камера
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        scene.fog = new THREE.Fog(0x0a0a0a, 50, 500);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 10);

        // Рендерер
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // Освещение
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        // Пол
        const floorGeometry = new THREE.PlaneGeometry(200, 200, 50, 50);
        const floorMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x1a1a1a,
            wireframe: true,
            transparent: true,
            opacity: 0.3
        });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Генерация препятствий
        const obstacles = [];
        const obstacleGeometry = new THREE.BoxGeometry(1, 1, 1);
        const obstacleMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x333333,
            roughness: 0.8,
            metalness: 0.2
        });

        for (let i = 0; i < 100; i++) {
            const obstacle = new THREE.Mesh(obstacleGeometry, obstacleMaterial);
            obstacle.position.set(
                (Math.random() - 0.5) * 150,
                Math.random() * 3 + 0.5,
                (Math.random() - 0.5) * 150
            );
            obstacle.scale.set(
                Math.random() * 3 + 1,
                Math.random() * 5 + 1,
                Math.random() * 3 + 1
            );
            scene.add(obstacle);
            obstacles.push(obstacle);
        }

        // Лидар устройство (визуализация)
        const lidarGroup = new THREE.Group();
        
        // Корпус лидара
        const lidarBodyGeometry = new THREE.CylinderGeometry(0.3, 0.3, 0.2, 16);
        const lidarBodyMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x00ff00,
            emissive: 0x003300,
            metalness: 0.8,
            roughness: 0.2
        });
        const lidarBody = new THREE.Mesh(lidarBodyGeometry, lidarBodyMaterial);
        lidarGroup.add(lidarBody);

        // Вращающаяся часть
        const lidarRotatingGeometry = new THREE.CylinderGeometry(0.25, 0.25, 0.1, 16);
        const lidarRotatingMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x00ffff,
            emissive: 0x003333,
            metalness: 0.9,
            roughness: 0.1
        });
        const lidarRotating = new THREE.Mesh(lidarRotatingGeometry, lidarRotatingMaterial);
        lidarRotating.position.y = 0.15;
        lidarGroup.add(lidarRotating);

        // Позиционируем лидар перед камерой
        lidarGroup.position.set(0, -0.5, -1);
        camera.add(lidarGroup);
        scene.add(camera);

        // Облако точек лидара
        let pointCloud = null;
        let pointCloudGeometry = null;
        const maxPoints = 50000;
        const pointsData = {
            positions: new Float32Array(maxPoints * 3),
            colors: new Float32Array(maxPoints * 3),
            count: 0
        };

        function initPointCloud() {
            pointCloudGeometry = new THREE.BufferGeometry();
            pointCloudGeometry.setAttribute('position', new THREE.BufferAttribute(pointsData.positions, 3));
            pointCloudGeometry.setAttribute('color', new THREE.BufferAttribute(pointsData.colors, 3));
            
            const pointMaterial = new THREE.PointsMaterial({ 
                size: 0.1,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });
            
            pointCloud = new THREE.Points(pointCloudGeometry, pointMaterial);
            scene.add(pointCloud);
        }

        initPointCloud();

        // Лучи лидара (визуализация)
        const laserLines = [];
        const laserMaterial = new THREE.LineBasicMaterial({ 
            color: 0xff0000,
            transparent: true,
            opacity: 0.6
        });

        function createLaserLine() {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(2 * 3);
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const line = new THREE.Line(geometry, laserMaterial);
            line.visible = false;
            scene.add(line);
            laserLines.push(line);
            return line;
        }

        // Создаем несколько линий для визуализации сканирования
        for (let i = 0; i < 20; i++) {
            createLaserLine();
        }

        // Управление
        const keys = { w: false, a: false, s: false, d: false };
        let isScanning = false;
        let scanAngle = 0;
        let isRightMouseDown = false;

        // Обработчики клавиш
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = true;
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = false;
        });

        // Обработчики мыши
        document.addEventListener('mousedown', (e) => {
            if (e.button === 0) { // ЛКМ
                isScanning = true;
                document.getElementById('status').textContent = 'Сканирование...';
                document.getElementById('scan-status').textContent = 'Вкл';
                document.getElementById('scan-status').style.color = '#0f0';
            } else if (e.button === 2) { // ПКМ
                isRightMouseDown = true;
                document.getElementById('status').textContent = 'Поворот камеры';
            }
        });

        document.addEventListener('mouseup', (e) => {
            if (e.button === 0) {
                isScanning = false;
                document.getElementById('status').textContent = 'Готов';
                document.getElementById('scan-status').textContent = 'Выкл';
                document.getElementById('scan-status').style.color = '#f00';
            } else if (e.button === 2) {
                isRightMouseDown = false;
                document.getElementById('status').textContent = 'Готов';
            }
        });

        document.addEventListener('wheel', (e) => {
            if (isScanning) {
                scanAngle += e.deltaY * 0.001;
                scanAngle = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, scanAngle));
            }
        });

        document.addEventListener('contextmenu', (e) => e.preventDefault());

        document.addEventListener('mousemove', (e) => {
            if (isRightMouseDown) {
                camera.rotation.y -= e.movementX * 0.002;
                camera.rotation.x -= e.movementY * 0.002;
                camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
            }
        });

        // Функция сканирования
        function performScan() {
            if (!isScanning || pointsData.count >= maxPoints) return;

            const raycaster = new THREE.Raycaster();
            const scansPerFrame = 50;
            const horizontalFOV = Math.PI / 3; // 60 градусов
            const verticalFOV = Math.PI / 6;   // 30 градусов

            for (let i = 0; i < scansPerFrame && pointsData.count < maxPoints; i++) {
                // Случайный угол в пределах FOV
                const hAngle = (Math.random() - 0.5) * horizontalFOV;
                const vAngle = (Math.random() - 0.5) * verticalFOV + scanAngle;

                // Направление луча
                const direction = new THREE.Vector3(
                    Math.sin(hAngle) * Math.cos(vAngle),
                    Math.sin(vAngle),
                    -Math.cos(hAngle) * Math.cos(vAngle)
                );
                direction.applyQuaternion(camera.quaternion);

                // Позиция начала луча (от лидара)
                const lidarWorldPos = new THREE.Vector3();
                lidarGroup.getWorldPosition(lidarWorldPos);

                raycaster.set(lidarWorldPos, direction);

                const intersects = raycaster.intersectObjects(obstacles);

                if (intersects.length > 0) {
                    const hit = intersects[0];
                    const distance = hit.distance;

                    // Добавляем точку
                    const index = pointsData.count * 3;
                    pointsData.positions[index] = hit.point.x;
                    pointsData.positions[index + 1] = hit.point.y;
                    pointsData.positions[index + 2] = hit.point.z;

                    // Цвет зависит от расстояния (зеленый -> желтый -> красный)
                    const normalizedDistance = Math.min(distance / 50, 1);
                    const r = normalizedDistance;
                    const g = 1 - normalizedDistance;
                    const b = 0;

                    pointsData.colors[index] = r;
                    pointsData.colors[index + 1] = g;
                    pointsData.colors[index + 2] = b;

                    pointsData.count++;

                    // Визуализация луча
                    if (laserLines[i % laserLines.length]) {
                        const line = laserLines[i % laserLines.length];
                        const positions = line.geometry.attributes.position.array;
                        positions[0] = lidarWorldPos.x;
                        positions[1] = lidarWorldPos.y;
                        positions[2] = lidarWorldPos.z;
                        positions[3] = hit.point.x;
                        positions[4] = hit.point.y;
                        positions[5] = hit.point.z;
                        line.geometry.attributes.position.needsUpdate = true;
                        line.visible = true;
                        
                        setTimeout(() => {
                            line.visible = false;
                        }, 100);
                    }
                }
            }

            // Обновляем облако точек
            if (pointsData.count > 0) {
                pointCloudGeometry.attributes.position.needsUpdate = true;
                pointCloudGeometry.attributes.color.needsUpdate = true;
                pointCloudGeometry.setDrawRange(0, pointsData.count);
                document.getElementById('point-count').textContent = pointsData.count;
            }

            // Вращаем лидар
            lidarRotating.rotation.y += 0.1;
        }

        // Движение игрока
        const moveSpeed = 0.15;
        const velocity = new THREE.Vector3();
        const direction_vec = new THREE.Vector3();

        function updateMovement() {
            direction_vec.set(0, 0, 0);

            if (keys.w) direction_vec.z = -1;
            if (keys.s) direction_vec.z = 1;
            if (keys.a) direction_vec.x = -1;
            if (keys.d) direction_vec.x = 1;

            if (direction_vec.length() > 0) {
                direction_vec.normalize();
                
                // Получаем направление камеры (только по горизонтали)
                const cameraDirection = new THREE.Vector3();
                camera.getWorldDirection(cameraDirection);
                cameraDirection.y = 0;
                cameraDirection.normalize();

                const cameraRight = new THREE.Vector3();
                cameraRight.crossVectors(cameraDirection, new THREE.Vector3(0, 1, 0));

                const moveVector = new THREE.Vector3();
                moveVector.addScaledVector(cameraDirection, -direction_vec.z);
                moveVector.addScaledVector(cameraRight, direction_vec.x);
                moveVector.normalize();

                camera.position.addScaledVector(moveVector, moveSpeed);
            }
        }

        // Анимация
        function animate() {
            requestAnimationFrame(animate);

            updateMovement();
            performScan();

            renderer.render(scene, camera);
        }

        // Ресайз окна
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Старт
        animate();

        console.log('LIDAR Simulator запущен!');
        console.log('Используйте WASD для движения, ЛКМ+колесо для сканирования, ПКМ для поворота камеры');
    </script>
</body>
</html>
